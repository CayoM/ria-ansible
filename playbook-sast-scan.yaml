# Scan an application's source code with Semgrep and upload the result to IBM Concert
# (static_code_scan). Started by the AWX job template scan-code-sast. Required extra vars:
# sast_application_name (the Concert application, e.g. robotshop-prod), sast_app_name (the
# demo app, e.g. robotshop; its repository comes from sast_repos), concert_url,
# concert_api_key. The job ends without scanning when the app has no repository or Concert
# already holds a scan of it (sast_force: true scans anyway). Optional: sast_repo_url,
# sast_application_version, sast_semgrep_config.
- name: Static code scan (Semgrep) and upload to Concert
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Run the code scan
      ansible.builtin.include_role:
        name: concert-demo
        tasks_from: setup_sast_scan.yaml
