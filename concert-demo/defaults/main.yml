---

######## Feature Flags ########
feature_kubecost: true
feature_instana: true
feature_sevone: true
###############################

# Host vulnerability scan (Trivy rootfs -> Concert vm_scan), see tasks/setup_vuln_scan.yaml
feature_vuln_scan: true
trivy_version: "0.75.0"
vuln_scan_dir: /var/lib/concert-vuln-scan
# Concert processes an upload slowly when it is large: 22,814 entries for 5,151 CVEs kept
# its scan job busy for over 15 minutes. Report what can be acted on.
vuln_scan_severities: "CRITICAL,HIGH,MEDIUM"
vuln_scan_ignore_unfixed: true   # only CVEs that have a fixed version
# The VM's identity in Concert: host scan (Nessus dnsName), Deploy SBOM (vm name/hostname)
# and the OS-patch mapping all use it. It must differ from the k3s node name: Concert's
# Kubernetes discovery already owns that name as a host of sub_type k8s:Node, a Deploy
# SBOM with the same name is merged into it, and OS auto-remediation only looks at
# hosts of sub_type vm ("No resource metadata found", verified 2026-10-20).
concert_vm_host_name: "{{ ansible_hostname }}-vm"
vuln_scan_hostname: "{{ concert_vm_host_name }}"
concert_url: ""            # https://<concert route>; empty = scan only, no upload
concert_api_key: ""

# Image vulnerability scan (Grype -> Concert image_scan), see tasks/setup_image_scan.yaml.
# Runs with the host scan when the Concert variables are given. The scanning and its
# filter (Critical/High on binaries, CVEs without a fix included) live in the scanner
# service on the cluster (optimized-solution tasks/install_grype_scanner.yml).
feature_image_scan: true
image_scan_namespaces: ["{{ app_namespace }}"]
image_scan_service_url: "http://grype-scanner.concert-image-scan.svc:8080"

# Compliance scan (Trivy CIS Kubernetes benchmark -> Concert compliance_posture), see tasks/setup_compliance_scan.yaml
compliance_dir: /var/lib/concert-compliance-scan
compliance_id: "k8s-cis-1.23"           # Trivy built-in spec, also the name of the Concert profile
compliance_profile: "{{ compliance_id }}"
compliance_scan_timeout: "30m"
compliance_show_checks: false           # true: print the checks Trivy reported in the job log
compliance_debug: false                 # true: do not hide Concert API calls in the job log (shows the API key)
compliance_env_name: ""                 # Concert environment (= deployment id)
compliance_application_name: ""         # Concert application, <app>-<environment type>

# Static code scan (Semgrep -> Concert static_code_scan), see tasks/setup_sast_scan.yaml
sast_dir: /tmp/concert-sast
sast_semgrep_version: "1.136.0"
sast_semgrep_config: "p/default"   # rule pack from the Semgrep registry (needs access to semgrep.dev)
sast_application_name: ""          # Concert application to attach the repository to (required)
sast_application_version: "1.0.0"
sast_app_name: ""                  # demo app (robotshop, qotd, ...), picks the repository from sast_repos
# app -> source repository, from the demo app catalog; an app without git_repo is skipped
sast_repos: "{{ demo_apps | selectattr('git_repo', 'defined') | rejectattr('git_repo', 'equalto', '')
  | items2dict(key_name='name', value_name='git_repo') }}"
sast_repo_url: ""                  # set to override the repository from sast_repos
sast_force: false                  # true: scan even if Concert already holds a scan of this repository

# Dynamic scan (OWASP ZAP -> Concert dynamic_scan), see tasks/setup_dast_scan.yaml
dast_dir: /tmp/concert-dast
dast_zap_proxy: "http://zap.concert-dast.svc:8090"   # ZAP service (optimized-solution install_zap.yml)
# Concert keeps ONE access point per name and ties it to one environment: a second
# environment uploading "web" fails with "access point is already associated with another
# environment" (ERR_ACCESS_POINT_ASSOCIATION, seen 2026-10-13 with PROD/INT next to DEV).
dast_access_point_name: "web-{{ dast_env_name }}"
dast_spider_max_children: 50
dast_target_url: ""                # e.g. http://web.<ip>.nip.io
dast_env_name: ""                  # Concert environment (= deployment id)

guard_cloud_init: true

# Pinned instead of "stable" (resolved via update.k3s.io) to avoid depending on
# that channel-resolution service's availability during install.
k3s_version: "v1.36.4+k3s1"

ansible_user: ubuntu
instance_name: "cayo123"

location: "south"
new_hostname: "{{ instance_name }}-{{ service_type }}.{{ instana_zone_name | lower }}"

# Demo app catalog: [{name, description, git_repo}]. Single source is optimized-solution
# (inventory demo_apps), which sets it as extra vars on the AWX job templates; it feeds the
# Concert Workflows tile, sast_repos and the Concert application description.
demo_apps: []
demo_app: "{{ demo_apps | selectattr('name', 'equalto', app_name) | first | default({}) }}"

# Web App
app_name: "robotshop" # a name from demo_apps
service_type: "frontend" # frontend / backend / full
app_namespace: "super-automation-demo"
registry_pwd: ""

# QotD
qotd_repo_url: "https://gitlab.com/api/v4/projects/26143345/packages/helm/stable"
qotd_repo_name: "qotd"

# Robot Shop
robotshop_git_repo: "https://github.com/instana/robot-shop.git"
robotshop_home: "/tmp"
robotshop_clone_dir: "{{ robotshop_home }}/repos/{{ app_namespace }}"

# INSTANA
instana_namespace: instana-agent
instana_repo_name: instana-agent
instana_repo_url: https://agents.instana.io/helm
instana_agent_key: ""
# Application perspective per deployment (tasks/setup_instana_appview.yaml). The API
# tokens come from the AWX credential "Instana API" (optimized-solution configure_awx.yml);
# a backend without a token is skipped.
instana_api_token: ""
instana_api_endpoint: "tech-workshop.instana.io"
instana_selfhosted_api_url: ""     # https://unit0-tenant0.instana.apps.<cluster>, the hub-attached Instana
instana_selfhosted_api_token: ""
instana_appview_label: "{{ instance_name }}"   # deployment id, e.g. robotshop-prod-a7f3
# Hostnames are <deployment id>-<service_type>.<zone> (new_hostname), so the prefix
# matches exactly the VMs of this deployment.
instana_appview_host_prefix: "{{ instance_name }}-"
# Perspectives of deployments whose hosts reported within this window are kept, older
# ones of the same label pattern are deleted (demo VMs live about an hour).
instana_appview_prune_window_ms: 7200000
instana_appview_label_pattern: '^[a-z0-9]+-(prod|dev|int|stage)-[a-z0-9]{4}$'
instana_endpoint_host: "ingress-green-saas.instana.io"
instana_eum_key: ""
instana_zone_name: "SUPER-AUTOMATION-DEMO-ZONE"
instana_cluster_name: "SUPER-AUTOMATION-DEMO-{{ instance_name }}"
instanaEnumMinJsUrl: "https://eum.instana.io/1.7.5/eum.min.js"
instanaReportingUrl: "https://eum-green-saas.instana.io"


# SNMP
snmp_syslocation: "AWS - eu-central-1 (Frankfurt)"
snmp_syscontact: "ops@example.com"
snmp_v3_user: "snmpuser"
snmp_v3_auth_protocol: "SHA"   # SHA | SHA-224 | SHA-256 | SHA-384 | SHA-512
snmp_v3_auth_pass: "CHANGE_ME_auth"
snmp_v3_priv_protocol: "AES"   # AES | AES-192 | AES-256 | DES
snmp_v3_priv_pass: "CHANGE_ME_priv"
