---
# tasks file for concert-demo
- name: Install dependencies
  ansible.builtin.include_tasks:
    file: setup_deps.yaml
    apply:
      tags:
        - deps
  tags:
    - deps

- name: Include K3S Setup
  ansible.builtin.include_tasks:
    file: setup_k3s.yaml
    apply:
      tags:
        - k3s
  tags:
    - k3s

################# Feature Flags for Components ####x
- name: Include SNMP Setup for SevOne
  when: feature_sevone | bool
  ansible.builtin.include_tasks:
    file: setup_snmp.yaml
    apply:
      tags:
        - snmp
        - sevone
  tags:
    - snmp
    - sevone

- name: Include Instana Agent Setup
  when: feature_instana | bool
  ansible.builtin.include_tasks:
    file: setup_instana_agent.yaml
    apply:
      tags:
        - instana
  tags:
    - instana

- name: Include KubeCost Setup
  when: feature_kubecost | bool
  ansible.builtin.include_tasks:
    file: setup_kubecost.yaml
    apply:
      tags:
        - kubecost
  tags:
    - kubecost
###################################################


################# App Deployment ##################
- name: Include Deployment of Flight Monitor App
  when: app_name == 'flightmonitor'
  ansible.builtin.include_tasks:
    file: setup_deploy_flightmonitor.yaml
    apply:
      tags:
        - flightmonitor
  tags:
    - flightmonitor

- name: Include Deployment of Quote of the Day App
  when: app_name == 'qotd'
  ansible.builtin.include_tasks:
    file: setup_deploy_qotd.yaml
    apply:
      tags:
        - qotd
  tags:
    - qotd

- name: Include Deployment of RobotShop App
  when: app_name == 'robotshop'
  ansible.builtin.include_tasks:
    file: setup_deploy_robot_shop.yaml
    apply:
      tags:
        - robotshop
  tags:
    - robotshop

- name: Include Deployment of Camera App
  when: app_name == 'camera'
  ansible.builtin.include_tasks:
    file: setup_deploy_camera.yaml
    apply:
      tags:
        - camera
  tags:
    - camera

# The Concert Workflow puts the description on the Concert application
# (Register-Concert-Kubernetes-Environment).
- name: Publish the app description from the demo app catalog
  ansible.builtin.set_stats:
    data:
      app_description: "{{ demo_app.description | default('') }}"

# One application perspective per deployment. "backend" alone serves no calls
# of its own, every other service_type runs the frontend.
- name: Include Instana Appview Setup
  when:
    - feature_instana | bool
    - service_type in ['frontend', 'full']
    - app_name | length > 0
  ansible.builtin.include_tasks:
    file: setup_instana_appview.yaml
    apply:
      tags:
        - instana_appview
  tags:
    - instana_appview
###################################################

################# Host Vulnerability Scan #########
- name: Include Host Vulnerability Scan (Concert vm_scan)
  when: feature_vuln_scan | bool
  ansible.builtin.include_tasks:
    file: setup_vuln_scan.yaml
    apply:
      tags:
        - vuln_scan
  tags:
    - vuln_scan
###################################################
