# Deploy SBOM (ConcertDef 2.0.0) for one VM, so that Concert can create OS-patch
# remediation actions for it (playbook-remediation-register.yaml).
#
# Schema: Concert 3.1 docs "Deploy SBOM schema (ConcertDef)". For auto-remediation the
# runtime component of type "vm" needs the properties "os" and "version". Concert's
# validator also requires "components" on it (docs VM example: deployment > image, as
# in IBM/Concert concert-concertdef-samples/spec-versions/2.0.0), so the app workloads
# running in k3s on the VM are listed there.
# The VM name is concert_vm_host_name (defaults/main.yml), the same name the host scan
# reports as dnsName, so scan, SBOM and patch talk about one host. Not the k3s node name:
# Concert's Kubernetes discovery owns that one as sub_type k8s:Node and would swallow the VM.
# Environment and application names are the ones the Concert Workflow registers
# (<deployment id>, <app>-<environment type>). Upload: data_type application_sbom (docs
# "Uploading data via API": also for deploy SBOMs).
#
# Inputs: ec2_ip, concert_url, concert_api_key, remediation_env_name,
#         remediation_application_name

- name: Set the VM's host name in Concert
  ansible.builtin.set_fact:
    remediation_vm_host: "{{ concert_vm_host_name }}"

- name: Read the app workloads running on the VM
  ansible.builtin.command: kubectl get deployments --all-namespaces -o json
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: remediation_k8s_deployments
  changed_when: false

- name: Build the workload components (deployment > image)
  ansible.builtin.set_fact:
    remediation_workloads: |
      {% set workloads = [] %}
      {% for d in remediation_app_deployments %}
      {%   set images = [] %}
      {%   for uri in d.spec.template.spec.containers | map(attribute='image') | unique %}
      {%     set _ = images.append({'bom-ref': 'image:' ~ uri, 'type': 'image',
                                    'name': uri | regex_replace('^.*/', '') | regex_replace('[:@].*$', ''),
                                    'uri': uri}) %}
      {%   endfor %}
      {%   set _ = workloads.append({'bom-ref': 'deployment:' ~ d.metadata.namespace ~ ':' ~ d.metadata.name,
                                     'type': 'deployment', 'name': d.metadata.name,
                                     'properties': [{'name': 'workload.type', 'value': 'container'}],
                                     'components': images}) %}
      {% endfor %}
      {{ workloads }}
  vars:
    remediation_system_namespaces: [kube-system, kube-public, kube-node-lease, instana-agent, metallb-system, kubecost]
    remediation_app_deployments: >-
      {{ (remediation_k8s_deployments.stdout | from_json)['items']
         | rejectattr('metadata.namespace', 'in', remediation_system_namespaces) | list }}

- name: Require at least one app workload on the VM
  ansible.builtin.assert:
    that: remediation_workloads | length > 0
    fail_msg: >-
      No app deployment found in k3s on {{ ec2_ip }} - Concert rejects a vm runtime
      component without components.

- name: Write the Deploy SBOM
  ansible.builtin.copy:
    dest: /tmp/remediation-deploy-sbom.json
    mode: "0600"
    content: "{{ remediation_sbom | to_nice_json }}"
  vars:
    remediation_vm_name: "{{ remediation_vm_host }}"
    remediation_sbom:
      bomFormat: ConcertDef
      specVersion: "2.0.0"
      metadata:
        timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        type: deploy
        deploy-name: "{{ remediation_env_name }}-vm"
        application-name: "{{ remediation_application_name }}"
        application-version: "{{ remediation_application_version | default('1.0.0') }}"
      environment:
        bom-ref: "environment:{{ remediation_env_name }}"
        name: "{{ remediation_env_name }}"
      runtime-components:
        - bom-ref: "infra:vm:{{ remediation_vm_name }}"
          name: "{{ remediation_vm_name }}"
          type: vm
          hostname: "{{ remediation_vm_name }}"
          ipv4:
            - addr: "{{ ec2_ip }}"
          properties:
            - name: os
              value: "{{ ansible_distribution | lower }}"
            - name: version
              value: "{{ ansible_distribution_version }}"
          components: "{{ remediation_workloads }}"
      dependencies:
        - ref: "environment:{{ remediation_env_name }}"
          dependsOn:
            - "infra:vm:{{ remediation_vm_name }}"

- name: Upload the Deploy SBOM
  ansible.builtin.include_tasks: concert_upload.yaml
  vars:
    upload_data_type: application_sbom
    upload_file: /tmp/remediation-deploy-sbom.json
    upload_metadata: {}
