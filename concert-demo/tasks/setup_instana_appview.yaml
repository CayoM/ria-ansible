# Instana application perspective per deployment, on every Instana backend the agent
# reports to: SaaS and the self-hosted Instana attached to the Concert hub (Concert reads
# the applications from there). Label = deployment id (also the Concert environment name),
# filter = the hostnames of this deployment's VMs (instana_appview_host_prefix).
#
# REST API instead of the former Terraform run on the VM: Terraform kept its state on the
# VM, so it could never update or delete a perspective, and its errors were ignored - with
# no API token passed in, no perspective was created at all (seen 2026-10-27).

- name: List the Instana backends that have an API token
  ansible.builtin.set_fact:
    instana_appview_backends: >-
      {{ ([{'name': 'SaaS',
            'url': 'https://' ~ (instana_api_endpoint | regex_replace('^https?://', '') | regex_replace('/+$', '')),
            'token': instana_api_token}] if instana_api_token | length > 0 else [])
         + ([{'name': 'self-hosted',
              'url': instana_selfhosted_api_url | regex_replace('/+$', ''),
              'token': instana_selfhosted_api_token}]
            if instana_selfhosted_api_token | length > 0 and instana_selfhosted_api_url | length > 0 else []) }}
    instana_appview_body:
      label: "{{ instana_appview_label }}"
      scope: INCLUDE_ALL_DOWNSTREAM
      boundaryScope: ALL
      accessRules:
        - accessType: READ_WRITE
          relationType: GLOBAL
          relatedId: null
      tagFilterExpression:
        type: TAG_FILTER
        name: host.name
        operator: STARTS_WITH
        entity: DESTINATION
        value: "{{ instana_appview_host_prefix }}"
        stringValue: "{{ instana_appview_host_prefix }}"
  no_log: true

- name: Report that no application perspective can be created
  ansible.builtin.debug:
    msg: >-
      WARNING: no Instana API token (AWX credential "Instana API"), no application
      perspective for {{ instana_appview_label }}
  when: instana_appview_backends | length == 0

- name: Create or update the application perspective on each backend
  ansible.builtin.include_tasks: instana_appview_backend.yaml
  loop: "{{ instana_appview_backends }}"
  loop_control:
    loop_var: instana_backend
    label: "{{ instana_backend.name }}"
