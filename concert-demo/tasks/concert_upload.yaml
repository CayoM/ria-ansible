# Upload one file to IBM Concert: POST /ingestion/api/v1/upload_files.
# Shared by the host scan (vm_scan) and the code scan (static_code_scan).
#
# Inputs:
#   concert_url, concert_api_key
#   upload_data_type   e.g. vm_scan, static_code_scan, dynamic_scan
#   upload_file        path of the file on the machine running this task
#   upload_metadata    dict, sent as the JSON "metadata" form field
#
# curl instead of ansible.builtin.uri on purpose, both attempts failed live:
#  - uri form-multipart base64-encodes a file part -> Concert's pipeline fails
#    with "Expecting value: line 1 column 1".
#  - passing the JSON as `content` -> Jinja turns the JSON text back into a
#    Python list, so Concert receives `[{'cve': ...` ("Expecting property name
#    enclosed in double quotes").
#
# The API key goes in via stdin (curl --config -) so it never shows in the
# process list. --insecure because Concert's gateway serves a self-signed
# certificate (same convention as the optimized-solution Concert tasks).
# A 202 only means "accepted"; Concert processes the file asynchronously.

- name: "Upload {{ upload_data_type }} to Concert"
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --insecure
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - --config
      - "-"
      - --form
      - "data_type={{ upload_data_type }}"
      - --form
      - "filename=@{{ upload_file }};type=application/json"
      - --form-string
      - "metadata={{ upload_metadata | to_json }}"
      - "{{ concert_url }}/ingestion/api/v1/upload_files"
    stdin: |
      header = "InstanceId: 0000-0000-0000-0000"
      header = "Authorization: C_API_KEY {{ concert_api_key }}"
  register: concert_upload
  retries: 3
  delay: 10
  until: concert_upload.stdout | default('') == '202'
  changed_when: concert_upload.stdout | default('') == '202'
  failed_when: concert_upload.stdout | default('') != '202'
  no_log: true
