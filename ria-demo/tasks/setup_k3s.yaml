- name: Get public IP
  ansible.builtin.shell: curl -s http://checkip.amazonaws.com
  register: ec2_public_ip

- name: Install k3s
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh | INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash
  register: k3s_install_result
  retries: 6
  delay: 20
  until: k3s_install_result.rc == 0

- name: Start k3s service
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Ensure k3s config is readable
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0755"

- name: Install kubectl binary link
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Wait for Kubernetes API to become available
  become: false
  retries: 20
  delay: 5
  register: result
  until: result.rc == 0
  ansible.builtin.shell: kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# Read-only access for Concert (IBM Concert Platform) to register this cluster
# as an Environment (Inventory > Environments > Kubernetes) and pull topology
# via its "kubernetes" connector. Kept separate from every app-specific
# ServiceAccount above/below on purpose - this one only ever needs the
# built-in "view" ClusterRole, same read-only scope Concert's docs ask for.
# Published as job artifacts (ansible.builtin.set_stats) so the calling
# Concert Workflow job (AAP-run-job-by-name / AAP-watch-job-by-name) can read
# them from $<step>.output without a separate SSH/API round trip - see
# cw-workflows/Register-Concert-Kubernetes-Environment.yaml in the
# optimized-solution repo, which consumes exactly these three keys.
#
# No ignore_errors here on purpose: the user wants to actually test this run,
# not have failures silently swallowed. Watch this step on the first live run.
- name: Create read-only ServiceAccount for Concert environment registration
  ansible.builtin.shell: |
    kubectl create serviceaccount concert-environment-reader -n kube-system --dry-run=client -o yaml | kubectl apply -f -
    kubectl create clusterrolebinding concert-environment-reader-view --clusterrole=view --serviceaccount=kube-system:concert-environment-reader --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Mint a long-lived token for the Concert ServiceAccount
  ansible.builtin.shell: kubectl create token concert-environment-reader -n kube-system --duration=8760h
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: concert_sa_token
  changed_when: false
  no_log: true

- name: Publish Concert environment registration data as job artifacts
  ansible.builtin.set_stats:
    data:
      k3s_endpoint: "https://{{ ec2_public_ip.stdout }}:6443"
      k3s_token: "{{ concert_sa_token.stdout }}"
      cluster_name: "{{ instana_cluster_name }}"
  no_log: true

- name: Install MetalLB via Helm
  ansible.builtin.shell: helm upgrade --install metallb oci://registry.suse.com/edge/charts/metallb --namespace metallb-system --create-namespace
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for MetalLB CRDs to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=Established crd/ipaddresspools.metallb.io --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: wait_result
  retries: 5
  delay: 10
  until: wait_result.rc == 0

- name: Wait until MetalLB webhook service is ready
  ansible.builtin.shell: |
    kubectl get endpoints metallb-webhook-service -n metallb-system -o jsonpath='{.subsets[*].addresses[*].ip}'
  register: metallb_webhook
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  retries: 15          # bis zu ~90 Sekunden
  delay: 6
  until: metallb_webhook.stdout != ""
  changed_when: false
  
- name: Apply MetalLB Resources (IP Pool)
  ansible.builtin.shell: |
    kubectl apply -n metallb-system -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: ip-pool
      namespace: metallb-system
    spec:
      addresses:
      - {{ ec2_public_ip.stdout }}/32
      - {{ ansible_default_ipv4.address }}/32 # Internal IP. If this is not NATted we might ahave issues so maybe double check for identity.
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply MetalLB Resources (Advert)
  ansible.builtin.shell: |
    kubectl apply -n metallb-system -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: ip-pool-l2-adv
      namespace: metallb-system
    spec:
      ipAddressPools:
      - ip-pool
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create MetalLB Role
  ansible.builtin.shell: |
    kubectl apply -n metallb-system -f - <<EOF
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: metallb-manager
      namespace: metallb-system
    rules:
      - apiGroups:
          - metallb.io        # MetalLB custom resources
        resources:
          - addresspools      # manage address pools
          - ipaddresspools    # manage IP address pools
          - bgpconfigs        # manage BGP configurations
          - l2configs         # manage L2 configurations
          - l2advertisements  # manage L2 advertisements
        verbs:
          - get
          - list
          - create
          - update
          - delete
          - patch
      - apiGroups:
          - apps              # manage MetalLB controller and speaker deployments
        resources:
          - deployments       # manage deployment resources for MetalLB
          - daemonsets        # manage daemonset resources for MetalLB
        verbs:
          - get
          - list
          - create
          - update
          - delete
          - patch
      - apiGroups:
          - networking.k8s.io  # for services and related resources
        resources:
          - services           # manage services that MetalLB operate
        verbs:
          - get
          - list
          - create
          - update
          - delete
          - patch
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create MetalLB Role
  ansible.builtin.shell: |
    kubectl apply -n metallb-system -f - <<EOF
    kind: RoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: mesh-metallb-manager
      namespace: metallb-system
    roleRef:
      kind: Role
      name: metallb-manager
    subjects:
    - kind: ServiceAccount
      name: mesh-rhsi-agent
      namespace: {{ app_namespace }}
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml


- name: Add Traefik Helm repo
  ansible.builtin.shell: helm repo add traefik https://traefik.github.io/charts
  args:
    creates: /root/.cache/helm/repository/traefik-index.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Update Helm repos
  ansible.builtin.shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Copy traefik.yaml to target
  ansible.builtin.copy:
    src: files/traefik.yaml
    dest: /tmp/traefik.yaml
    mode: '0644'

- name: Install Traefik via Helm with fixed NodePorts
  ansible.builtin.shell: |
    helm upgrade --install traefik traefik/traefik \
      --namespace kube-system \
      --create-namespace \
      -f /tmp/traefik.yaml \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml